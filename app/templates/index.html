{% extends "base.html" %} {% block content %}
{% if username %}
<h1>Hi, {{ username }} !</h1>
{% endif %}
<form action="" method="post" novalidate>
  {{ form.hidden_tag() }}
  <p>{{ form.languages.label }} {{ form.languages }}</p>
  <p>
    {{ form.movie_geners.label }}  {{ form.movie_geners(cols=1, multiple=True) }}
  </p>
  <p>{{ form.submit() }}</p>
</form>

{% endblock %}
